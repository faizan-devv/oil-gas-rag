[project]
name = "field-qa"
version = "0.1.0"
description = "RAG, extraction and prompt-strategy lab over an oil and gas document corpus"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.50",
    "chromadb>=0.5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pypdf>=5.0",
    "pandas>=2.2",
    "python-dateutil>=2.9",
    "httpx>=0.27",
    "rank-bm25>=0.2.2",
    "numpy>=2.5.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "fpdf2>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
